services:
  postgres:
    image: postgres:15-alpine
    container_name: saas_postgres_local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projeto_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projeto_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
